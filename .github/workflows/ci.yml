name: JARVIS Autonomous AI Test Suite

on:
  push:
    branches: [ main, gh-pages ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock numpy psutil mss pillow pywin32 comtypes pyyaml requests
      - name: Run Test Suite
        run: pytest -v --tb=short
