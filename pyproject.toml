# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-agent"
version = "4.0.0"
description = "JARVIS - autonomous Windows desktop AI assistant (voice, agent, screen, memory)"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Aayush Bhatta", email = "aayush@example.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Desktop Environment",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "httpx>=0.27", "psutil>=5.9", "pywin32>=306", "comtypes>=1.2", "PySide6>=6.6",
  "sounddevice>=0.4.6", "onnxruntime>=1.17", "faster-whisper>=1.0", "SpeechRecognition>=3.10",
  "edge-tts>=7.3.1", "miniaudio>=1.59", "mss>=9.0", "pillow>=10.0", "pytesseract>=0.3.10",
  "uiautomation>=2.0", "pycaw>=20240210", "pyautogui>=0.9.54", "pyperclip>=1.8", "pypdf>=4.0",
  "python-docx>=1.1", "beautifulsoup4>=4.12", "send2trash>=1.8",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=0.9",
  "edge-tts>=7.3.1",
  "pydub>=0.25",
]
embeddings = [
  "openai>=1.0",
  "chromadb>=0.4",
  "faiss-cpu>=1.7",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.21",
  "pytest-mock>=3.11",
  "ruff>=0.1",
]

[project.gui-scripts]
jarvis = "jarvis.__main__:main"

[project.urls]
Homepage = "https://github.com/aayushbhatta230-ux/jarvis-ai-agent"
Repository = "https://github.com/aayushbhatta230-ux/jarvis-ai-agent"
Issues = "https://github.com/aayushbhatta230-ux/jarvis-ai-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*", "core*", "voice*", "interface*", "tools*", "vision*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["E501", "SIM102", "SIM103", "T201", "T203"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]
"interface/server.py" = ["T201"]
"voice/listener.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["e2e: end-to-end tests needing a running Ollama"]
filterwarnings = [
  "ignore::DeprecationWarning",
]