<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS — Your AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
	--bg: #0d1117;
	--bg-elevated: #161b22;
	--fg: #e6edf3;
	--fg-muted: #8b949e;
	--accent: #58a6ff;
	--accent-glow: rgba(88, 166, 255, 0.4);
	--success: #3fb950;
	--warning: #d29922;
	--danger: #f85149;
	--border: #30363d;
	--card: #161b22;
	--input-bg: #0d1117;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
	font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
	background: var(--bg);
	color: var(--fg);
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
}

#app {
	display: flex;
	flex-direction: column;
	height: 100vh;
	height: 100dvh; /* Dynamic viewport for mobile browsers */
}

/* --- Header --- */
header {
	flex: 0 0 auto;
	padding: env(safe-area-inset-top, 16px) 20px 12px;
	text-align: center;
	border-bottom: 1px solid var(--border);
	background: linear-gradient(180deg, rgba(22,27,34,0.95), transparent);
	backdrop-filter: blur(8px);
	position: sticky;
	top: 0;
	z-index: 10;
}

.logo {
	display: inline-flex;
	align-items: center;
	gap: 10px;
	font-family: 'JetBrains Mono', monospace;
	font-weight: 600;
	font-size: clamp(18px, 4vw, 22px);
	letter-spacing: -0.02em;
}

.logo svg { width: 28px; height: 28px; color: var(--accent); }

.status-badge {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	margin-top: 6px;
	padding: 4px 12px;
	border-radius: 999px;
	font-size: 12px;
	font-weight: 500;
	font-family: 'JetBrains Mono', monospace;
	background: var(--card);
	border: 1px solid var(--border);
	color: var(--fg-muted);
}

.status-badge .dot {
	width: 8px; height: 8px; border-radius: 50%;
	background: var(--fg-muted);
	transition: background 0.3s, box-shadow 0.3s;
}

.status-badge.connected .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-badge.connecting .dot { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
.status-badge.error .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* --- Main Content --- */
main {
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	overflow: hidden;
	padding: 20px;
	gap: 16px;
}

/* Tunnel Card */
.tunnel-card {
	flex: 0 0 auto;
	background: var(--card);
	border: 1px solid var(--border);
	border-radius: 16px;
	padding: 20px;
	box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

.tunnel-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 16px;
}

.tunnel-title {
	font-weight: 600;
	font-size: 16px;
	display: flex;
	align-items: center;
	gap: 8px;
}

.tunnel-title::before {
	content: '';
	width: 10px; height: 10px;
	border-radius: 2px;
	background: var(--accent);
}

.url-display {
	flex: 1;
	margin-top: 12px;
	font-family: 'JetBrains Mono', monospace;
	font-size: 13px;
	background: var(--input-bg);
	border: 1px solid var(--border);
	border-radius: 8px;
	padding: 12px 14px;
	color: var(--fg-muted);
	word-break: break-all;
	user-select: all;
	-webkit-user-select: all;
}

.url-display.has-url { color: var(--fg); }

/* Action Buttons */
.btn-group {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 12px;
	margin-top: 16px;
}

.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	padding: 14px 20px;
	border-radius: 12px;
	font-family: 'Space Grotesk', sans-serif;
	font-weight: 600;
	font-size: 15px;
	border: none;
	cursor: pointer;
	transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;
}

.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary {
	background: linear-gradient(135deg, var(--accent), #388bfd);
	color: #0d1117;
	box-shadow: 0 4px 16px var(--accent-glow);
}

.btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); }

.btn-secondary {
	background: var(--bg-elevated);
	color: var(--fg);
	border: 1px solid var(--border);
}

.btn-secondary:hover { border-color: var(--accent); }

.btn-danger {
	background: var(--danger);
	color: white;
}

.btn svg { width: 18px; height: 18px; }

/* QR Code Section */
.qr-section {
	margin-top: 20px;
	padding-top: 20px;
	border-top: 1px solid var(--border);
	text-align: center;
}

.qr-label { font-size: 13px; color: var(--fg-muted); margin-bottom: 12px; }

#qrcode {
	display: inline-block;
	padding: 12px;
	background: white;
	border-radius: 12px;
	box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

#qrcode img { display: block; width: 200px; height: 200px; }

/* Connection Status Toast */
.toast-container {
	position: fixed;
	bottom: env(safe-area-inset-bottom, 20px);
	left: 50%;
	transform: translateX(-50%);
	z-index: 1000;
	display: flex;
	flex-direction: column;
	gap: 8px;
	align-items: center;
	pointer-events: none;
}

.toast {
	padding: 12px 20px;
	border-radius: 10px;
	font-size: 14px;
	font-weight: 500;
	background: var(--card);
	border: 1px solid var(--border);
	box-shadow: 0 8px 32px rgba(0,0,0,0.4);
	animation: slideUp 0.3s ease-out;
	pointer-events: auto;
	display: flex;
	align-items: center;
	gap: 10px;
	max-width: 90vw;
}

.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }

@keyframes slideUp {
	from { opacity: 0; transform: translateY(20px); }
	to { opacity: 1; transform: translateY(0); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after {
		animation-duration: 0.01ms !important;
		transition-duration: 0.01ms !important;
	}
}

/* Landscape orientation adjustments */
@media (orientation: landscape) and (max-height: 500px) {
	main { padding: 12px; gap: 12px; }
	.tunnel-card { padding: 16px; }
	.btn { padding: 12px 16px; }
	#qrcode img { width: 160px; height: 160px; }
}
</style>
</head>
<body>
<div id="app">
<header>
	<div class="logo">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<polygon points="5 3 19 12 5 21 5 3"></polygon>
		</svg>
		JARVIS
	</div>
	<div id="statusBadge" class="status-badge">
		<span class="dot"></span>
		<span id="statusText">Checking tunnel…</span>
	</div>
</header>

<main>
	<section class="tunnel-card" aria-label="Tunnel connection">
		<div class="tunnel-header">
			<h2 class="tunnel-title">Tunnel Connection</h2>
		</div>
		<div id="urlDisplay" class="url-display" aria-live="polite">Waiting for tunnel…</div>
		<div class="btn-group">
			<button id="refreshBtn" class="btn btn-secondary" aria-label="Refresh tunnel status">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
				Refresh
			</button>
			<button id="openBtn" class="btn btn-primary" disabled aria-label="Open JARVIS interface">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></path><line x1="10" y1="14" x2="21" y2="3"></line></svg>
				Open JARVIS
			</button>
		</div>
		<div class="qr-section">
			<p class="qr-label">Scan to open on this device</p>
			<div id="qrcode" aria-hidden="true"></div>
		</div>
	</section>
</main>

<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
(function() {
	'use strict';

	// --- Config ---
	const API_BASE = window.location.origin;
	const POLL_INTERVAL = 3000; // 3s
	const MAX_RETRIES = 10;

	// --- Elements ---
	const statusBadge = document.getElementById('statusBadge');
	const statusText = document.getElementById('statusText');
	const urlDisplay = document.getElementById('urlDisplay');
	const refreshBtn = document.getElementById('refreshBtn');
	const openBtn = document.getElementById('openBtn');
	const qrcodeEl = document.getElementById('qrcode');
	const toastContainer = document.getElementById('toastContainer');

	// --- State ---
	let pollTimer = null;
	let retryCount = 0;
	let currentTunnelUrl = null;
	let isOnline = navigator.onLine;

	// --- Toast System ---
	function showToast(message, type = 'info', duration = 4000) {
		const toast = document.createElement('div');
		toast.className = `toast ${type}`;
		toast.textContent = message;
		toastContainer.appendChild(toast);

		setTimeout(() => {
			toast.style.animation = 'slideUp 0.3s ease-out reverse';
			setTimeout(() => toast.remove(), 300);
		}, duration);
	}

	// --- QR Code Generation (no external deps) ---
	function renderQRCode(url) {
		qrcodeEl.innerHTML = '';
		// Use Google Chart API for simplicity (works offline if cached)
		// For production, consider a local QR library like qrcodejs
		const size = 200;
		const img = document.createElement('img');
		img.src = `https://chart.googleapis.com/chart?chs=${size}x${size}&cht=qr&chl=${encodeURIComponent(url)}&choe=UTF-8`;
		img.alt = 'QR code for ' + url;
		img.width = size;
		img.height = size;
		img.loading = 'lazy';
		img.onerror = () => {
			// Fallback: show URL text
			qrcodeEl.textContent = url;
			qrcodeEl.style.fontFamily = 'monospace';
			qrcodeEl.style.fontSize = '12px';
			qrcodeEl.style.wordBreak = 'break-all';
		};
		qrcodeEl.appendChild(img);
	}

	// --- Update UI for tunnel state ---
	function setTunnelState(state, url = null) {
		statusBadge.className = 'status-badge ' + state;
		switch (state) {
			case 'connected':
				statusText.textContent = 'Connected';
				urlDisplay.classList.add('has-url');
				urlDisplay.textContent = url;
				openBtn.disabled = false;
				renderQRCode(url);
				currentTunnelUrl = url;
				retryCount = 0;
				break;
			case 'connecting':
				statusText.textContent = 'Connecting…';
				urlDisplay.classList.remove('has-url');
				urlDisplay.textContent = 'Establishing tunnel…';
				openBtn.disabled = true;
				qrcodeEl.innerHTML = '';
				break;
			case 'error':
				statusText.textContent = 'Connection failed';
				urlDisplay.classList.remove('has-url');
				urlDisplay.textContent = 'Unable to establish tunnel. Check server.';
				openBtn.disabled = true;
				qrcodeEl.innerHTML = '';
				break;
			default:
				statusText.textContent = 'Checking tunnel…';
				urlDisplay.classList.remove('has-url');
				urlDisplay.textContent = 'Waiting for tunnel…';
				openBtn.disabled = true;
				qrcodeEl.innerHTML = '';
		}
	}

	// --- Poll tunnel status ---
	async function pollTunnel() {
		if (!isOnline) {
			setTunnelState('error');
			return;
		}
		try {
			const controller = new AbortController();
			const timeout = setTimeout(() => controller.abort(), 5000);
			const res = await fetch(`${API_BASE}/api/tunnel`, {
				signal: controller.signal,
				headers: { 'Accept': 'application/json' }
			});
			clearTimeout(timeout);
			if (!res.ok) throw new Error(`HTTP ${res.status}`);
			const data = await res.json();
			if (data.url) {
				setTunnelState('connected', data.url);
			} else {
				setTunnelState('connecting');
			}
		} catch (err) {
			console.warn('[TUNNEL] Poll failed:', err);
			retryCount++;
			if (retryCount >= MAX_RETRIES) {
				setTunnelState('error');
				showToast('Tunnel unavailable. Is the server running?', 'error', 6000);
				stopPolling();
			} else {
				setTunnelState('connecting');
			}
		}
	}

	function startPolling() {
		if (pollTimer) return;
		pollTunnel(); // immediate
		pollTimer = setInterval(pollTunnel, POLL_INTERVAL);
	}

	function stopPolling() {
		if (pollTimer) {
			clearInterval(pollTimer);
			pollTimer = null;
		}
	}

	// --- Event Listeners ---
	refreshBtn.addEventListener('click', () => {
		retryCount = 0;
		setTunnelState('connecting');
		pollTunnel();
	});

	openBtn.addEventListener('click', () => {
		if (currentTunnelUrl) {
			window.open(currentTunnelUrl, '_blank');
			showToast('Opening JARVIS…', 'success');
		}
	});

	urlDisplay.addEventListener('click', () => {
		if (currentTunnelUrl) {
			navigator.clipboard?.writeText(currentTunnelUrl).then(() => {
				showToast('URL copied to clipboard', 'success');
			}).catch(() => {
				// fallback: select text
				urlDisplay.select();
				showToast('URL selected — copy manually', 'info');
			});
		}
	});

	// Online/offline detection
	window.addEventListener('online', () => {
		isOnline = true;
		showToast('Back online', 'success');
		startPolling();
	});
	window.addEventListener('offline', () => {
		isOnline = false;
		showToast('You are offline', 'warning', 6000);
	});

	// Visibility change: pause polling when hidden
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) stopPolling();
		else startPolling();
	});

	// --- Init ---
	startPolling();
})();
</script>
</body>
</html>
