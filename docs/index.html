<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030408">
  <title>JARVIS &mdash; Connecting to Neural Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030408;
      color: #e0f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .core-ring {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #00e5ff;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #80deea;
      margin-bottom: 28px;
    }
    .btn-connect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #00b0ff, #00e5ff);
      color: #001e28;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 229, 255, 0.4);
      transition: transform 0.15s ease;
    }
    .btn-connect:active { transform: scale(0.97); }
    .hint {
      margin-top: 32px;
      font-size: 0.75rem;
      color: rgba(128, 222, 234, 0.6);
      max-width: 320px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="core-ring"></div>
  <h1>JARVIS Gateway</h1>
  <p id="statusMsg">Connecting to your personal PC neural core…</p>
  <a class="btn-connect" id="directLink" href="https://intelligent-heart-lodge-heights.trycloudflare.com">
    <span>&#9889;</span> Open JARVIS Directly
  </a>
  <div class="hint">
    Permanent access portal for iPhone Safari.<br>Tap Share &rarr; Add to Home Screen to bookmark.
  </div>

  <script>
    let targetUrl = "https://intelligent-heart-lodge-heights.trycloudflare.com";

    function doRedirect(url) {
      if (!url) return;
      try {
        window.location.replace(url);
      } catch (_) {
        window.location.href = url;
      }
    }

    // Attempt to dynamically fetch freshest endpoint from GitHub Raw
    const controller = new AbortController();
    const timeoutId = setTimeout(() => {
      controller.abort();
      doRedirect(targetUrl);
    }, 1200);

    fetch("https://raw.githubusercontent.com/aayushbhatta230-ux/jarvis-ai-agent/main/docs/endpoint.json?t=" + Date.now(), {
      signal: controller.signal
    })
    .then(r => r.json())
    .then(data => {
      clearTimeout(timeoutId);
      if (data && data.tunnel_url) {
        targetUrl = data.tunnel_url;
        const btn = document.getElementById("directLink");
        if (btn) btn.href = targetUrl;
      }
      doRedirect(targetUrl);
    })
    .catch(() => {
      doRedirect(targetUrl);
    });
  </script>
</body>
</html>
