<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - Page Not Found | Aayush Bhatta</title>
    <meta name="description" content="Page not found. Redirecting to home...">
    <meta http-equiv="refresh" content="3;url=/">
    <link rel="canonical" href="https://aayushbhatta230-ux.github.io/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d1117; --fg:#e6edf3; --fg-muted:#8b949e; --accent:#58a6ff; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
        .container{max-width:400px}
        h1{font-size:6rem;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;line-height:1;margin-bottom:1rem}
        p{color:var(--fg-muted);margin-bottom:2rem;font-size:1.1rem}
        a{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:var(--accent);color:#0d1117;border-radius:8px;font-weight:600;text-decoration:none;transition:box-shadow 0.2s}
        a:hover{box-shadow:0 0 24px rgba(88,166,255,0.4)}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found. Redirecting to home in 3 seconds...</p>
        <a href="/">← Back to Home</a>
    </div>
    <script>setTimeout(()=>window.location.href='/',3000)</script>
</body>
</html>
