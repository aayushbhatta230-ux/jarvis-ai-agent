<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
	<!-- Header / Status Bar -->
	<header class="hud-header" role="banner">
		<div class="header-left">
			<div class="logo" aria-hidden="true">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
					<polygon points="5 3 19 12 5 21 5 3"></polygon>
				</svg>
				<span class="logo-text">JARVIS</span>
			</div>
		</div>
		<div class="header-center">
			<div id="stateIndicator" class="state-indicator" aria-live="polite" aria-atomic="true">
				<span class="state-dot" aria-hidden="true"></span>
				<span id="stateText">Initializing…</span>
			</div>
		</div>
		<div class="header-right">
			<button id="micBtn" class="icon-btn mic-btn" aria-label="Toggle microphone" aria-pressed="false" title="Microphone (M)">
				<svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
					<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
					<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
					<line x1="12" y1="19" x2="12" y2="22"></line>
				</svg>
				<svg class="mic-muted-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" style="display:none">
					<path d="M9 1v3a3 3 0 0 1-3 3v8a3 3 0 0 1 3 3v3"></path>
					<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
					<line x1="1" y1="1" x2="23" y2="23"></path>
				</svg>
			</button>
			<button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings (S)">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
					<circle cx="12" cy="12" r="3"></circle>
					<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
				</svg>
			</button>
		</div>
	</header>

	<!-- Main Conversation Area -->
	<main class="hud-main" role="main">
		<div id="conversation" class="conversation" aria-live="polite" aria-atomic="false">
			<!-- Messages injected here -->
		</div>
		<div id="typingIndicator" class="typing-indicator" aria-hidden="true">
			<span class="typing-dot"></span>
			<span class="typing-dot"></span>
			<span class="typing-dot"></span>
		</div>
	</main>

	<!-- Input Bar -->
	<footer class="hud-footer" role="contentinfo">
		<div class="input-wrapper">
			<button id="attachBtn" class="icon-btn" aria-label="Attach file" title="Attach (A)">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
					<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"></path>
				</svg>
			</button>
			<div class="input-field-container">
				<textarea
					id="textInput"
					class="text-input"
					placeholder="Type a command…"
					rows="1"
					aria-label="Command input"
					spellcheck="false"
					autocomplete="off"
					autocorrect="off"
					autocapitalize="off"
					enterkeyhint="send"
				></textarea>
			</div>
			<button id="sendBtn" class="icon-btn send-btn" aria-label="Send command" title="Send (Enter)">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
					<line x1="22" y1="2" x2="11" y2="13"></line>
					<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
				</svg>
			</button>
		</div>
		<div class="footer-hints" aria-hidden="true">
			<kbd>Enter</kbd> Send · <kbd>M</kbd> Mic · <kbd>S</kbd> Settings
		</div>
	</footer>

	<!-- Settings Modal -->
	<div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
		<div class="modal-backdrop" tabindex="-1"></div>
		<div class="modal-content">
			<header class="modal-header">
				<h2 id="settingsTitle">Settings</h2>
				<button class="modal-close" aria-label="Close settings">&times;</button>
			</header>
			<div class="modal-body">
				<section class="settings-section">
					<h3>Voice</h3>
					<label class="setting-row">
						<span>Auto Listen</span>
						<input type="checkbox" id="autoListenSetting" role="switch">
					</label>
					<label class="setting-row">
						<span>Barge-in (interrupt while speaking)</span>
						<input type="checkbox" id="bargeInSetting" role="switch">
					</label>
					<label class="setting-row">
						<span>PC Speaker Output</span>
						<input type="checkbox" id="pcSpeakerSetting" role="switch">
					</label>
					<label class="setting-row">
						<span>Response Verbosity</span>
						<select id="verbositySetting">
							<option value="concise">Concise</option>
							<option value="normal">Normal</option>
							<option value="detailed">Detailed</option>
						</select>
					</label>
				</section>
				<section class="settings-section">
					<h3>Visual</h3>
					<label class="setting-row">
						<span>Theme</span>
						<select id="themeSetting">
							<option value="dark">Dark</option>
							<option value="light">Light</option>
							<option value="system">System</option>
						</select>
					</label>
					<label class="setting-row">
						<span>Visual Intensity</span>
						<input type="range" id="intensitySetting" min="0" max="1" step="0.1" value="0.7">
					</label>
				</section>
				<section class="settings-section">
					<h3>Permissions</h3>
					<label class="setting-row">
						<span>Permission Level</span>
						<select id="permissionSetting">
							<option value="OFF">Off</option>
							<option value="OBSERVE_ONLY">Observe Only</option>
							<option value="CONTROL_WITH_CONFIRMATION">Control with Confirmation</option>
							<option value="FULL_CONTROL">Full Control</option>
						</select>
					</label>
				</section>
			</div>
		</div>
	</div>

	<!-- Confirmation Modal -->
	<div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
		<div class="modal-backdrop" tabindex="-1"></div>
		<div class="modal-content confirm-modal">
			<header class="modal-header">
				<h2 id="confirmTitle">Confirm Action</h2>
			</header>
			<div class="modal-body">
				<p id="confirmDescription"></p>
				<div id="confirmDetails" class="confirm-details"></div>
			</div>
			<footer class="modal-footer">
				<button id="confirmCancel" class="btn btn-secondary">Cancel</button>
				<button id="confirmOk" class="btn btn-danger">Confirm</button>
			</footer>
		</div>
	</div>

	<!-- Toast Container -->
	<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
